    <!-- ------------------------------------------------------------ -->
    <!-- Twitter Card metadata                                         -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Nikhil — Product Analytics for Modern Teams" />
    <meta name="twitter:description" content="Real-time product analytics and insights for modern teams." />
    <meta name="twitter:image" content="https://nikhil.app/og-image.png" />
    <meta name="twitter:image:alt" content="Nikhil product analytics dashboard" />
    <meta name="twitter:site" content="@nikhilapp" />
    <meta name="twitter:creator" content="@nikhilapp" />

    <!-- ------------------------------------------------------------ -->
    <!-- Performance: preconnect and preload hints                     -->
    <!-- ------------------------------------------------------------ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",

      ]

    <!-- ------------------------------------------------------------ -->
    <!-- Inline critical CSS to avoid a flash of unstyled content      -->
    <!-- ------------------------------------------------------------ -->
    <style>
      /* ============================================================ */
      /* Design tokens                                                  */
      /* ============================================================ */
      :root {
        --nikhil-bg: #0b0d14;
        --nikhil-surface: #12141f;
        --nikhil-surface-2: #181b29;
        --nikhil-border: #23263a;
        --nikhil-text: #e8eaf6;
        --nikhil-muted: #9aa0b5;
        --nikhil-accent: #6d5efc;
        --nikhil-accent-soft: #8b7dff;
        --nikhil-success: #2dd4a7;
        --nikhil-warning: #f5b544;
        --nikhil-danger: #f26d6d;
        --nikhil-radius-sm: 6px;
        --nikhil-radius-md: 10px;
        --nikhil-radius-lg: 16px;
        --nikhil-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        --nikhil-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* ============================================================ */
      /* Reset                                                          */
      /* ============================================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--nikhil-bg);
        color: var(--nikhil-text);
        font-family: var(--nikhil-font);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        line-height: 1.5;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ============================================================ */
      /* Typography helpers                                             */
      /* ============================================================ */
      h1, h2, h3, h4, h5, h6 {
        margin: 0;
        font-weight: 600;
        line-height: 1.2;
      }

      p {
        margin: 0;
      }

      a {
        color: var(--nikhil-accent-soft);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      img {
        max-width: 100%;
        display: block;
      }

      /* ============================================================ */
      /* Scrollbar styling                                              */
      /* ============================================================ */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: var(--nikhil-bg);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--nikhil-border);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--nikhil-muted);
      }

      /* ============================================================ */
      /* Selection                                                      */
      /* ============================================================ */
      ::selection {
        background: var(--nikhil-accent);
        color: #ffffff;
      }

      /* ============================================================ */
      /* Boot splash screen                                             */
      /* ============================================================ */
      #nikhil-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--nikhil-bg);
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #nikhil-boot .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--nikhil-border);
        border-top-color: var(--nikhil-accent);
        border-radius: 50%;
        animation: nikhil-spin 0.8s linear infinite;
      }

      #nikhil-boot .boot-label {
        color: var(--nikhil-muted);
        font-size: 14px;
        letter-spacing: 0.02em;
      }

      @keyframes nikhil-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes nikhil-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #nikhil-boot .spinner {
          animation-duration: 1.6s;
        }
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ============================================================ */
      /* Utility classes (used by the boot screen and fallback UI)     */
      /* ============================================================ */
      .nikhil-hidden {
        display: none !important;
      }

      .nikhil-sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .nikhil-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .nikhil-flex {
        display: flex;
        align-items: center;
      }

      .nikhil-grid {
        display: grid;
        gap: 16px;
      }

      .nikhil-card {
        background: var(--nikhil-surface);
        border: 1px solid var(--nikhil-border);
        border-radius: var(--nikhil-radius-lg);
        padding: 24px;
        box-shadow: var(--nikhil-shadow);
      }

      .nikhil-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        border: 1px solid transparent;
        border-radius: var(--nikhil-radius-md);
        background: var(--nikhil-accent);
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      .nikhil-btn:hover {
        background: var(--nikhil-accent-soft);
      }

      .nikhil-btn:active {
        transform: translateY(1px);
      }

      .nikhil-btn--ghost {
        background: transparent;
        border-color: var(--nikhil-border);
        color: var(--nikhil-text);
      }

      .nikhil-btn--ghost:hover {
        background: var(--nikhil-surface-2);
      }

      .nikhil-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: var(--nikhil-surface-2);
        color: var(--nikhil-muted);
      }

      .nikhil-badge--success {
        background: rgba(45, 212, 167, 0.12);
        color: var(--nikhil-success);
      }

      .nikhil-badge--warning {
        background: rgba(245, 181, 68, 0.12);
        color: var(--nikhil-warning);
      }

      .nikhil-badge--danger {
        background: rgba(242, 109, 109, 0.12);
        color: var(--nikhil-danger);
      }

      .nikhil-text-muted {
        color: var(--nikhil-muted);
      }

      .nikhil-text-sm {
        font-size: 13px;
      }

      .nikhil-text-lg {
        font-size: 18px;
      }

      .nikhil-mt-1 { margin-top: 4px; }
      .nikhil-mt-2 { margin-top: 8px; }
      .nikhil-mt-3 { margin-top: 12px; }
      .nikhil-mt-4 { margin-top: 16px; }
      .nikhil-mt-5 { margin-top: 24px; }
      .nikhil-mb-1 { margin-bottom: 4px; }
      .nikhil-mb-2 { margin-bottom: 8px; }
      .nikhil-mb-3 { margin-bottom: 12px; }
      .nikhil-mb-4 { margin-bottom: 16px; }
      .nikhil-mb-5 { margin-bottom: 24px; }

      /* ============================================================ */
      /* Responsive breakpoints                                        */
      /* ============================================================ */
      @media (max-width: 768px) {
        .nikhil-container {
          padding: 0 16px;
        }
        .nikhil-card {
          padding: 16px;
        }
      }

      @media (max-width: 480px) {
        .nikhil-container {
          padding: 0 12px;
        }
        .nikhil-btn {
          width: 100%;
        }
      }

    </style>
  </head>
  <body>
    <!-- ------------------------------------------------------------ -->
    <!-- Application mount point. React renders the full app here.     -->
    <!-- ------------------------------------------------------------ -->
    <div id="root"></div>

    <!-- ------------------------------------------------------------ -->
    <!-- Boot splash screen (removed automatically once React mounts). -->
    <!-- ------------------------------------------------------------ -->
    <div id="nikhil-boot" aria-hidden="true">
      <div class="spinner" role="status" aria-label="Loading Nikhil"></div>
      <span class="boot-label">Loading Nikhil…</span>
    </div>

    <!-- ------------------------------------------------------------ -->
    <!-- No-JavaScript fallback message.                               -->
    <!-- ------------------------------------------------------------ -->
    <noscript>
      <div style="
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0d14;
        color: #e8eaf6;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      ">
        <div>
          <h1 style="font-size: 24px; margin-bottom: 12px;">JavaScript is required</h1>
          <p style="color: #9aa0b5; max-width: 420px; margin: 0 auto;">
            Nikhil is a real-time analytics application and needs JavaScript to run.
            Please enable JavaScript in your browser and reload the page.
          </p>
        </div>
      </div>
    </noscript>

    <!-- ------------------------------------------------------------ -->
    <!-- Application entry module. Vite transforms and bundles this.   -->
    <!-- ------------------------------------------------------------ -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- ------------------------------------------------------------ -->
    <!-- Remove the boot splash once the app has mounted.              -->
    <!-- ------------------------------------------------------------ -->
    <script>
      (function () {
        function hideBoot() {
          var boot = document.getElementById('nikhil-boot');
          if (boot) {
            boot.style.opacity = '0';
            window.setTimeout(function () {
              if (boot.parentNode) {
                boot.parentNode.removeChild(boot);
              }
            }, 320);
          }
        }
        if (document.readyState === 'complete') {
          hideBoot();
        } else {
          window.addEventListener('load', hideBoot);
        }
      })();
    </script>
  </body>
</html>
